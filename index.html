<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Gnomely</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: #111a10;
    color: #e8e0c8;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    padding-bottom: 70px;
    overflow-x: hidden;
  }
  .page { display: none; padding: 16px; }
  .page.active { display: block; animation: fade .25s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px);} to {opacity:1;transform:none;} }

  h2 { margin: 0 0 14px; font-size: 20px; color: #d6ad48; }
  .coin-row {
    display: flex; justify-content: space-between; align-items: center;
    background: #1d2a19; border: 1px solid #2c3d24; border-radius: 14px;
    padding: 12px 16px; margin-bottom: 16px;
  }
  .coin-row span { font-size: 22px; font-weight: 700; color: #d6ad48; }

  .gnome {
    font-size: 96px; text-align: center; margin: 10px 0 20px;
    filter: drop-shadow(0 6px 12px rgba(0,0,0,.5));
    will-change: transform;
  }

  .stat { margin-bottom: 12px; }
  .stat-label {
    display: flex; justify-content: space-between;
    font-size: 13px; margin-bottom: 5px; color: #b9c9a8;
  }
  .bar {
    height: 12px; background: #1d2a19; border-radius: 8px;
    overflow: hidden; border: 1px solid #2c3d24;
  }
  .bar > div {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #7ab648, #a8d96b);
    transition: width .35s ease;
  }
  #mood  { background: linear-gradient(90deg, #d6ad48, #f0d27a); }
  #energy{ background: linear-gradient(90deg, #4a90d9, #7ab8f0); }
  #clean { background: linear-gradient(90deg, #7ec8d9, #b8e8f0); }

  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
  .actions button {
    padding: 14px; font-size: 15px; font-weight: 600;
    background: #2c3d24; color: #e8e0c8; border: 1px solid #3d5232;
    border-radius: 14px; cursor: pointer; transition: transform .1s;
  }
  .actions button:active { transform: scale(.96); background: #3d5232; }

  .shop-item {
    display: flex; justify-content: space-between; align-items: center;
    background: #1d2a19; border: 1px solid #2c3d24; border-radius: 14px;
    padding: 14px; margin-bottom: 10px;
  }
  .shop-item button {
    padding: 10px 16px; background: #d6ad48; color: #111a10;
    border: 0; border-radius: 10px; font-weight: 700; cursor: pointer;
  }
  .shop-item button:active { transform: scale(.95); }

  .top-player {
    display: flex; align-items: center; gap: 12px;
    background: #1d2a19; border: 1px solid #2c3d24; border-radius: 14px;
    padding: 10px 14px; margin-bottom: 8px;
  }
  .top-player.me { border-color: #d6ad48; background: #253219; }
  .place { width: 32px; text-align: center; font-weight: 700; color: #d6ad48; }
  .avatar {
    width: 40px; height: 40px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: #2c3d24; font-size: 22px; overflow: hidden; flex-shrink: 0;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .top-info { flex: 1; min-width: 0; }
  .top-name { font-weight: 600; font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .top-score { font-size: 12px; color: #8fa87e; }
  .loading, .error { text-align: center; padding: 24px; color: #8fa87e; }

  .nav {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: flex; background: #1d2a19;
    border-top: 1px solid #2c3d24;
    padding-bottom: env(safe-area-inset-bottom);
    z-index: 100;
  }
  .nav button {
    flex: 1; padding: 14px 6px 12px;
    background: none; color: #8fa87e; border: 0;
    font-size: 12px; cursor: pointer; transition: color .2s;
  }
  .nav button .ico { display: block; font-size: 22px; margin-bottom: 2px; }
  .nav button.active { color: #d6ad48; }
</style>
</head>
<body>

<!-- ДОМ -->
<div id="home" class="page active">
  <div class="coin-row">
    <div>Твой баланс</div>
    <span><span id="coinBalance">0</span> 🪙</span>
  </div>

  <div class="gnome">🧙</div>

  <div class="stat">
    <div class="stat-label"><span>🍗 Сытость</span><span id="hungerText">0</span></div>
    <div class="bar"><div id="hunger"></div></div>
  </div>
  <div class="stat">
    <div class="stat-label"><span>😊 Настроение</span><span id="moodText">0</span></div>
    <div class="bar"><div id="mood"></div></div>
  </div>
  <div class="stat">
    <div class="stat-label"><span>⚡ Энергия</span><span id="energyText">0</span></div>
    <div class="bar"><div id="energy"></div></div>
  </div>
  <div class="stat">
    <div class="stat-label"><span>🧼 Чистота</span><span id="cleanText">0</span></div>
    <div class="bar"><div id="clean"></div></div>
  </div>

  <div class="actions">
    <button onclick="care('feed')">🍖 Покормить</button>
    <button onclick="care('play')">🎮 Играть</button>
    <button onclick="care('wash')">🧼 Помыть</button>
    <button onclick="care('sleep')">😴 Спать</button>
  </div>
</div>

<!-- МАГАЗИН -->
<div id="shop" class="page">
  <h2>🛒 Магазин</h2>
  <div class="shop-item">
    <div>🍞 Хлеб (+15 сытости)</div>
    <button onclick="buyCoins(50,'food15','food15')">50 🪙</button>
  </div>
  <div class="shop-item">
    <div>🍖 Пир (+25 сытости)</div>
    <button onclick="buyCoins(90,'food25','food25')">90 🪙</button>
  </div>
  <div class="shop-item">
    <div>⚡ Зелье бодрости (+30)</div>
    <button onclick="buyCoins(120,'energy30','energy30')">120 🪙</button>
  </div>
  <div class="shop-item">
    <div>🎁 Подарок (+20 настроения)</div>
    <button onclick="buyCoins(100,'mood20','mood20')">100 🪙</button>
  </div>
  <div class="shop-item">
    <div>⭐ Премиум-скин</div>
    <button onclick="buyStars(50,'skin1')">50 ⭐</button>
  </div>
</div>

<!-- ТОП -->
<div id="top" class="page">
  <h2>🏆 Рейтинг</h2>
  <div id="leaderboard"></div>
</div>

<!-- НАВИГАЦИЯ -->
<div class="nav">
  <button class="active" onclick="showPage('home', this)"><span class="ico">🏠</span>Дом</button>
  <button onclick="showPage('shop', this)"><span class="ico">🛒</span>Магазин</button>
  <button onclick="showPage('top', this)"><span class="ico">🏆</span>Топ</button>
</div>

<script>
// ============================
// TELEGRAM
// ============================
const tg = window.Telegram?.WebApp;

if (tg) {
    tg.ready();
    tg.expand();
    tg.setHeaderColor('#1d2a19');
    tg.setBackgroundColor('#111a10');
    tg.disableVerticalSwipes?.();
}

const tgUser = tg?.initDataUnsafe?.user || null;

const player = {
    id: tgUser?.id || 'guest_' + (localStorage.getItem('gnomely_guest_id')
        || (() => { const id = Math.random().toString(36).slice(2);
             localStorage.setItem('gnomely_guest_id', id); return id; })()),
    name: tgUser ? [tgUser.first_name, tgUser.last_name].filter(Boolean).join(' ')
                 || tgUser.username || 'Игрок'
                 : 'Гость',
    avatar: tgUser?.photo_url || null,
    username: tgUser?.username || null
};

// ============================
// СОСТОЯНИЕ
// ============================
const SAVE_KEY = 'gnomely_save_v1';
const DAY_MS = 24 * 60 * 60 * 1000;

const DEFAULT_STATE = {
    coins: 0,
    hunger: 75,
    mood: 82,
    energy: 64,
    clean: 91,
    lastUpdate: Date.now(),
    lastDailyReset: Date.now(),
    careCount: 0,
    totalCare: 0,
    streak: 0,
    inventory: [],
    ownedSkins: []
};

let state = { ...DEFAULT_STATE };

function clamp(v) { return Math.max(0, Math.min(100, Math.round(v))); }

// ============================
// ЗАГРУЗКА / СОХРАНЕНИЕ
// ============================
function loadState() {
    try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (!raw) return false;
        const saved = JSON.parse(raw);
        state = { ...DEFAULT_STATE, ...saved };
        if (!Array.isArray(state.inventory)) state.inventory = [];
        if (!Array.isArray(state.ownedSkins)) state.ownedSkins = [];
        return true;
    } catch (e) {
        console.warn('Не удалось загрузить сохранение', e);
        return false;
    }
}

function saveState() {
    state.lastUpdate = Date.now();
    try { localStorage.setItem(SAVE_KEY, JSON.stringify(state)); }
    catch (e) { console.warn('Не удалось сохранить', e); }
    if (tg?.CloudStorage) {
        tg.CloudStorage.setItem(SAVE_KEY, JSON.stringify(state), (err) => {
            if (err) console.warn('CloudStorage error', err);
        });
    }
}

async function loadFromCloud() {
    if (!tg?.CloudStorage) return false;
    return new Promise((resolve) => {
        tg.CloudStorage.getItem(SAVE_KEY, (err, value) => {
            if (err || !value) return resolve(false);
            try {
                const saved = JSON.parse(value);
                if (saved.lastUpdate && saved.lastUpdate > (state.lastUpdate || 0)) {
                    state = { ...DEFAULT_STATE, ...saved };
                    if (!Array.isArray(state.inventory)) state.inventory = [];
                    if (!Array.isArray(state.ownedSkins)) state.ownedSkins = [];
                    resolve(true);
                } else resolve(false);
            } catch { resolve(false); }
        });
    });
}

// ============================
// УСТАЛОСТЬ
// ============================
const DECAY_PER_MS = {
    hunger: -3 / (60 * 60 * 1000),
    mood:   -2 / (60 * 60 * 1000),
    energy: -1 / (60 * 60 * 1000),
    clean:  -2 / (60 * 60 * 1000)
};

function applyDecay() {
    const now = Date.now();
    const dt = now - (state.lastUpdate || now);
    if (dt <= 0 || dt > DAY_MS * 30) { state.lastUpdate = now; return; }
    ['hunger','mood','energy','clean'].forEach(k => {
        state[k] = clamp(state[k] + DECAY_PER_MS[k] * dt);
    });
    state.lastUpdate = now;
}

function checkDailyReset() {
    const now = Date.now();
    const since = now - (state.lastDailyReset || now);
    if (since >= DAY_MS) {
        const daysPassed = Math.floor(since / DAY_MS);
        if (daysPassed === 1 && state.careCount >= 4) state.streak += 1;
        else state.streak = 0;
        state.careCount = 0;
        state.lastDailyReset = now;
    }
}

// ============================
// UI
// ============================
function updateUI() {
    document.getElementById("coinBalance").textContent = state.coins;

    const stats = [
        ["hunger", "hungerText", state.hunger],
        ["mood",   "moodText",   state.mood],
        ["energy", "energyText", state.energy],
        ["clean",  "cleanText",  state.clean]
    ];
    stats.forEach(([bar, text, value]) => {
        document.getElementById(bar).style.width = value + "%";
        document.getElementById(text).textContent = value;
    });

    const nameEl = document.getElementById("playerName");
    if (nameEl) nameEl.textContent = player.name;
}

// ============================
// ДЕЙСТВИЯ
// ============================
const DAILY_LIMIT = 12;

function care(type) {
    checkDailyReset();
    if (state.careCount >= DAILY_LIMIT) {
        notify(`Дневной лимит исчерпан (${DAILY_LIMIT}). Возвращайся завтра!`);
        return;
    }

    let reward = 0;

    if (type === "feed") {
        state.hunger = clamp(state.hunger + 15);
        state.mood   = clamp(state.mood + 3);
        reward = 10;
    }
    if (type === "play") {
        if (state.energy < 10) { notify("Гном слишком устал для игр 😴"); return; }
        state.mood   = clamp(state.mood + 12);
        state.energy = clamp(state.energy - 5);
        state.hunger = clamp(state.hunger - 3);
        reward = 8;
    }
    if (type === "wash") {
        state.clean = clamp(state.clean + 20);
        state.mood  = clamp(state.mood - 2);
        reward = 8;
    }
    if (type === "sleep") {
        state.energy = clamp(state.energy + 20);
        state.hunger = clamp(state.hunger - 2);
        reward = 7;
    }

    state.coins += reward;
    state.careCount += 1;
    state.totalCare += 1;

    saveState();
    updateUI();
}

function notify(msg) {
    if (tg?.showAlert) tg.showAlert(msg);
    else alert(msg);
}

// ============================
// МАГАЗИН
// ============================
function buyCoins(price, itemId, effect) {
    if (state.coins < price) { notify("Не хватает 🪙"); return; }
    state.coins -= price;

    if (effect === "food15")   state.hunger = clamp(state.hunger + 15);
    if (effect === "food25")   state.hunger = clamp(state.hunger + 25);
    if (effect === "energy30") state.energy = clamp(state.energy + 30);
    if (effect === "mood20")   state.mood   = clamp(state.mood + 20);
    if (itemId) state.inventory.push(itemId);

    saveState();
    updateUI();
    notify("Куплено!");
}

function buyStars(price, itemId) {
    if (tg?.openInvoice) {
        notify(`Оплата ${price} ⭐ — подключим после настройки бота.`);
    } else {
        notify(`Здесь будет оплата ${price} ⭐`);
    }
}

// ============================
// РЕЙТИНГ
// ============================
async function loadLeaderboard() {
    const box = document.getElementById("leaderboard");
    box.innerHTML = '<div class="loading">Загрузка рейтинга...</div>';

    let players = null;
    try {
        const resp = await fetch("/api/leaderboard", {
            headers: { "X-Telegram-Init-Data": tg?.initData || "" }
        });
        if (resp.ok) {
            const data = await resp.json();
            if (Array.isArray(data) && data.length) players = data;
        }
    } catch (_) {}

    if (!players) players = buildLocalLeaderboard();
    renderLeaderboard(players);
}

function buildLocalLeaderboard() {
    const me = {
        name: player.name,
        avatar: player.avatar || "🧙",
        score: state.coins + state.totalCare * 5,
        isMe: true
    };
    const demo = [
        { name: "Гримли",         avatar: "🧔", score: 2480 },
        { name: "Моховик",        avatar: "🌿", score: 2110 },
        { name: "Тыквоголовый",   avatar: "🎃", score: 1875 },
        { name: "Бородач II",     avatar: "🍄", score: 1620 },
        { name: "Лесной дух",     avatar: "🌲", score: 1400 },
        { name: "Каменюка",       avatar: "🪨", score: 1230 },
        { name: "Мшистый",        avatar: "🍀", score: 990 },
        { name: "Гном-новичок",   avatar: "👶", score: 720 },
        { name: "Старый Пень",    avatar: "🪵", score: 510 }
    ];
    return [...demo, me].sort((a, b) => b.score - a.score).slice(0, 10);
}

function escapeHTML(s) {
    return String(s).replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
}

function renderLeaderboard(players) {
    const box = document.getElementById("leaderboard");
    box.innerHTML = "";

    players.slice(0, 10).forEach((p, index) => {
        const row = document.createElement("div");
        row.className = "top-player" + (p.isMe ? " me" : "");

        const medal = index === 0 ? "🥇" : index === 1 ? "🥈" : index === 2 ? "🥉" : index + 1;
        const avatarHTML = (p.avatar && String(p.avatar).startsWith("http"))
            ? `<img src="${escapeHTML(p.avatar)}">`
            : (p.avatar || "🧙");

        row.innerHTML = `
            <div class="place">${medal}</div>
            <div class="avatar">${avatarHTML}</div>
            <div class="top-info">
                <div class="top-name">${escapeHTML(p.name)}${p.isMe ? " (вы)" : ""}</div>
                <div class="top-score">${Number(p.score).toLocaleString("ru-RU")} очков</div>
            </div>
        `;
        box.appendChild(row);
    });

    if (!players.length) box.innerHTML = '<div class="error">Рейтинг пока пуст.</div>';
}

// ============================
// НАВИГАЦИЯ
// ============================
function showPage(page, button) {
    document.querySelectorAll(".page").forEach(x => x.classList.remove("active"));
    document.getElementById(page).classList.add("active");
    document.querySelectorAll(".nav button").forEach(x => x.classList.remove("active"));
    button.classList.add("active");
    if (page === "top") loadLeaderboard();
}

// ============================
// АНИМАЦИЯ
// ============================
function animateGnome() {
    const gnome = document.querySelector(".gnome");
    if (!gnome) return;
    let t = 0;
    setInterval(() => {
        t += 0.1;
        const y = Math.sin(t) * 3;
        gnome.style.transform = `translateY(${y}px)`;
    }, 60);
}

// ============================
// СТАРТ
// ============================
async function init() {
    loadState();
    await loadFromCloud();
    applyDecay();
    checkDailyReset();
    updateUI();
    animateGnome();

    setInterval(() => {
        applyDecay();
        updateUI();
        saveState();
    }, 30000);

    window.addEventListener("beforeunload", saveState);
    console.log("Игрок:", player);
}

init();
</script>
</body>
  </html>
