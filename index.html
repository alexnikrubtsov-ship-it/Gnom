<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Gnom</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    height: 100%;
    background: #111a10;
    color: #e8e2d0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow-x: hidden;
    -webkit-tap-highlight-color: transparent;
  }
  body { display: flex; flex-direction: column; padding: 12px; gap: 12px; }

  header {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 12px; background: #1d2a19; border-radius: 14px;
  }
  #playerName { font-weight: 600; }
  .coins { font-size: 18px; font-weight: 700; color: #d6ad48; }

  .page { display: none; flex: 1; flex-direction: column; gap: 12px; }
  .page.active { display: flex; }

  .gnome-stage {
    display: flex; justify-content: center; align-items: center;
    min-height: 180px; font-size: 96px; user-select: none;
  }
  .gnome { display: inline-block; }

  .stats { display: flex; flex-direction: column; gap: 8px; }
  .stat { display: flex; align-items: center; gap: 8px; font-size: 13px; }
  .stat .bar {
    flex: 1; height: 10px; background: #1d2a19; border-radius: 6px; overflow: hidden;
  }
  .stat .bar > div {
    height: 100%; background: linear-gradient(90deg, #6fae4a, #d6ad48);
    transition: width .4s ease; border-radius: 6px;
  }
  .stat .label { width: 72px; opacity: .8; }
  .stat .val { width: 30px; text-align: right; opacity: .9; }

  .actions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .actions button {
    padding: 14px; border: none; border-radius: 12px;
    background: #1d2a19; color: #e8e2d0; font-size: 15px;
    cursor: pointer; transition: transform .15s, background .15s;
  }
  .actions button:active { transform: scale(.96); background: #2a3a24; }

  .shop-item {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px; background: #1d2a19; border-radius: 12px;
  }
  .shop-item button {
    padding: 8px 14px; border: none; border-radius: 10px;
    background: #d6ad48; color: #111a10; font-weight: 700; cursor: pointer;
  }

  #leaderboard { display: flex; flex-direction: column; gap: 8px; }
  .top-player {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 12px; background: #1d2a19; border-radius: 12px;
    border: 2px solid transparent;
  }
  .top-player .place { width: 28px; text-align: center; font-weight: 700; }
  .top-player .avatar {
    width: 36px; height: 36px; border-radius: 50%;
    background: #2a3a24; display: flex; align-items: center; justify-content: center;
    font-size: 20px; overflow: hidden;
  }
  .top-player .top-info { flex: 1; }
  .top-player .top-name { font-size: 14px; font-weight: 600; }
  .top-player .top-score { font-size: 12px; opacity: .7; }
  .top-player .exclusive { font-size: 11px; opacity: .6; }

  .loading, .error { text-align: center; padding: 20px; opacity: .7; }

  .nav {
    display: flex; gap: 6px; background: #1d2a19;
    padding: 6px; border-radius: 14px;
  }
  .nav button {
    flex: 1; padding: 10px; border: none; border-radius: 10px;
    background: transparent; color: #e8e2d0; font-size: 14px; cursor: pointer;
  }
  .nav button.active { background: #d6ad48; color: #111a10; font-weight: 700; }

  /* Экран отладки — видно даже если JS сломался */
  #debug {
    position: fixed; top: 0; left: 0; right: 0;
    background: rgba(0,0,0,.85); color: #ffb; font-size: 11px;
    padding: 6px 10px; z-index: 9999; font-family: monospace;
    white-space: pre-wrap; max-height: 40vh; overflow-y: auto;
    display: none;
  }
</style>
</head>
<body>

<!-- Экран отладки поверх всего -->
<div id="debug"></div>

<header>
  <div id="playerName">Гость</div>
  <div class="coins">🪙 <span id="coinBalance">0</span></div>
</header>

<section id="home" class="page active">
  <div class="gnome-stage"><div class="gnome">🧙</div></div>
  <div class="stats">
    <div class="stat"><span class="label">Сытость</span>
      <div class="bar"><div id="hunger"></div></div>
      <span class="val" id="hungerText">0</span></div>
    <div class="stat"><span class="label">Настроение</span>
      <div class="bar"><div id="mood"></div></div>
      <span class="val" id="moodText">0</span></div>
    <div class="stat"><span class="label">Энергия</span>
      <div class="bar"><div id="energy"></div></div>
      <span class="val" id="energyText">0</span></div>
    <div class="stat"><span class="label">Чистота</span>
      <div class="bar"><div id="clean"></div></div>
      <span class="val" id="cleanText">0</span></div>
  </div>
  <div class="actions">
    <button onclick="care('feed')">🍖 Покормить</button>
    <button onclick="care('play')">🎲 Поиграть</button>
    <button onclick="care('wash')">🛁 Помыть</button>
    <button onclick="care('sleep')">😴 Спать</button>
  </div>
</section>

<section id="shop" class="page">
  <div class="shop-item"><span>🍞 Еда +15</span>
    <button onclick="buyCoins(30, 'food15', 'food15')">30 🪙</button></div>
  <div class="shop-item"><span>🍗 Еда +25</span>
    <button onclick="buyCoins(50, 'food25', 'food25')">50 🪙</button></div>
  <div class="shop-item"><span>⚡ Энергия +30</span>
    <button onclick="buyCoins(40, 'energy30', 'energy30')">40 🪙</button></div>
  <div class="shop-item"><span>🎁 Настроение +20</span>
    <button onclick="buyCoins(45, 'mood20', 'mood20')">45 🪙</button></div>
  <div class="shop-item"><span>⭐ Премиум</span>
    <button onclick="buyStars(100, 'premium')">100 ⭐</button></div>
</section>

<section id="top" class="page">
  <div id="leaderboard"></div>
</section>

<nav class="nav">
  <button class="active" onclick="showPage('home', this)">🏠 Гном</button>
  <button onclick="showPage('shop', this)">🛒 Магазин</button>
  <button onclick="showPage('top', this)">🏆 Рейтинг</button>
</nav>

<script>
/* ==========================================================
   ОТЛАДКА — работает ДО всего остального, показывает проблемы
   прямо на экране (в Telegram консоль часто недоступна)
   ========================================================== */
(function debugPanel() {
    const dbg = document.getElementById('debug');
    const lines = [];
    function show(msg, color) {
        lines.push(msg);
        dbg.textContent = lines.slice(-8).join('\n');
        dbg.style.display = 'block';
        dbg.style.color = color || '#ffb';
        console.log(msg);
    }

    window.addEventListener('error', (e) => {
        show('❌ ' + e.message + ' @ ' + (e.filename || '?') + ':' + e.lineno, '#f88');
    });
    window.addEventListener('unhandledrejection', (e) => {
        show('❌ Promise: ' + (e.reason?.message || e.reason), '#f88');
    });

    // Проверка Telegram
    window.__dbg = show;
    setTimeout(() => {
        const hasTg = !!window.Telegram;
        const hasWebApp = !!window.Telegram?.WebApp;
        const initData = window.Telegram?.WebApp?.initData;
        show('Telegram: ' + hasTg + ' | WebApp: ' + hasWebApp +
             ' | initData: ' + (initData ? initData.length + ' симв.' : 'пусто'));
        if (!hasTg) show('⚠️ Скрипт telegram-web-app.js не загрузился!', '#f88');
        // Скрыть панель через 8 сек, если ошибок нет
        setTimeout(() => { dbg.style.display = 'none'; }, 8000);
    }, 500);
})();

/* ==========================================================
   ОСНОВНОЙ КОД
   ========================================================== */
const tg = window.Telegram?.WebApp;

if (tg) {
    tg.ready();
    tg.expand();
    tg.setHeaderColor('#1d2a19');
    tg.setBackgroundColor('#111a10');
    tg.disableVerticalSwipes?.();
}

const tgUser = tg?.initDataUnsafe?.user || null;

const player = {
    id: tgUser?.id || 'guest_' + (localStorage.getItem('gnomely_guest_id') 
        || (() => { const id = Math.random().toString(36).slice(2); 
             localStorage.setItem('gnomely_guest_id', id); return id; })()),
    name: tgUser ? [tgUser.first_name, tgUser.last_name].filter(Boolean).join(' ') 
                 || tgUser.username || 'Игрок' 
                 : 'Гость',
    avatar: tgUser?.photo_url || null,
    username: tgUser?.username || null
};

const SAVE_KEY = 'gnomely_save_v1';
const DAY_MS = 24 * 60 * 60 * 1000;

const DEFAULT_STATE = {
    coins: 0,
    hunger: 75,
    mood: 82,
    energy: 64,
    clean: 91,
    lastUpdate: Date.now(),
    lastDailyReset: Date.now(),
    careCount: 0,
    totalCare: 0,
    streak: 0,
    inventory: [],
    ownedSkins: []
};

let state = { ...DEFAULT_STATE };

function loadState() {
    try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (!raw) return false;
        const saved = JSON.parse(raw);
        state = { ...DEFAULT_STATE, ...saved };
        return true;
    } catch (e) {
        console.warn('Не удалось загрузить сохранение', e);
        return false;
    }
}

function saveState() {
    state.lastUpdate = Date.now();
    try {
        localStorage.setItem(SAVE_KEY, JSON.stringify(state));
    } catch (e) {
        console.warn('Не удалось сохранить', e);
    }
    if (tg?.CloudStorage) {
        tg.CloudStorage.setItem(SAVE_KEY, JSON.stringify(state), (err) => {
            if (err) console.warn('CloudStorage error', err);
        });
    }
}

async function loadFromCloud() {
    if (!tg?.CloudStorage) return;
    return new Promise((resolve) => {
        tg.CloudStorage.getItem(SAVE_KEY, (err, value) => {
            if (err || !value) return resolve(false);
            try {
                const saved = JSON.parse(value);
                if (saved.lastUpdate && saved.lastUpdate > (state.lastUpdate || 0)) {
                    state = { ...DEFAULT_STATE, ...saved };
                    resolve(true);
                } else resolve(false);
            } catch { resolve(false); }
        });
    });
}

const DECAY_PER_MS = {
    hunger: -3 / (60 * 60 * 1000),
    mood:   -2 / (60 * 60 * 1000),
    energy: -1 / (60 * 60 * 1000),
    clean:  -2 / (60 * 60 * 1000)
};

function applyDecay() {
    const now = Date.now();
    const dt = now - (state.lastUpdate || now);
    if (dt <= 0 || dt > DAY_MS * 30) { 
        state.lastUpdate = now; 
        return; 
    }
    ['hunger', 'mood', 'energy', 'clean'].forEach(k => {
        state[k] = clamp(state[k] + DECAY_PER_MS[k] * dt);
    });
    state.lastUpdate = now;
}

function clamp(v) { return Math.max(0, Math.min(100, Math.round(v))); }

function checkDailyReset() {
    const now = Date.now();
    const since = now - (state.lastDailyReset || now);
    if (since >= DAY_MS) {
        const daysPassed = Math.floor(since / DAY_MS);
        if (daysPassed === 1 && state.careCount >= 4) {
            state.streak += 1;
        } else {
            state.streak = 0;
        }
        state.careCount = 0;
        state.lastDailyReset = now;
    }
}

function updateUI() {
    document.getElementById("coinBalance").textContent = state.coins;

    const stats = [
        ["hunger", "hungerText", state.hunger],
        ["mood", "moodText", state.mood],
        ["energy", "energyText", state.energy],
        ["clean", "cleanText", state.clean]
    ];

    stats.forEach(([bar, text, value]) => {
        document.getElementById(bar).style.width = value + "%";
        document.getElementById(text).textContent = value;
    });

    const nameEl = document.getElementById("playerName");
    if (nameEl) nameEl.textContent = player.name;
}

const DAILY_LIMIT = 12;

function care(type) {
    checkDailyReset();

    if (state.careCount >= DAILY_LIMIT) {
        tg?.showAlert ? tg.showAlert(`Дневной лимит исчерпан (${DAILY_LIMIT}). Возвращайся завтра!`) 
                      : alert(`Дневной лимит исчерпан (${DAILY_LIMIT}).`);
        return;
    }

    let reward = 0;

    if (type === "feed") {
        state.hunger = clamp(state.hunger + 15);
        state.mood = clamp(state.mood + 3);
        reward = 10;
    }
    if (type === "play") {
        if (state.energy < 10) {
            notify("Гном слишком устал для игр 😴");
            return;
        }
        state.mood = clamp(state.mood + 12);
        state.energy = clamp(state.energy - 5);
        state.hunger = clamp(state.hunger - 3);
        reward = 8;
    }
    if (type === "wash") {
        state.clean = clamp(state.clean + 20);
        state.mood = clamp(state.mood - 2);
        reward = 8;
    }
    if (type === "sleep") {
        state.energy = clamp(state.energy + 20);
        state.hunger = clamp(state.hunger - 2);
        reward = 7;
    }

    state.coins += reward;
    state.careCount += 1;
    state.totalCare += 1;

    saveState();
    updateUI();
}

function notify(msg) {
    if (tg?.showAlert) tg.showAlert(msg);
    else alert(msg);
}

function buyCoins(price, itemId, effect) {
    if (state.coins < price) {
        notify("Не хватает 🪙");
        return;
    }
    state.coins -= price;

    if (effect === "food15") state.hunger = clamp(state.hunger + 15);
    if (effect === "food25") state.hunger = clamp(state.hunger + 25);
    if (effect === "energy30") state.energy = clamp(state.energy + 30);
    if (effect === "mood20") state.mood = clamp(state.mood + 20);
    if (itemId) state.inventory.push(itemId);

    saveState();
    updateUI();
    notify("Куплено!");
}

function buyStars(price, itemId) {
    if (tg?.openInvoice) {
        notify(`Оплата ${price} ⭐ — подключим после настройки бота.`);
    } else {
        notify(`Здесь будет оплата ${price} ⭐`);
    }
}

async function loadLeaderboard() {
    const box = document.getElementById("leaderboard");
    box.innerHTML = '<div class="loading">Загрузка рейтинга...</div>';

    let players = null;

    try {
        const resp = await fetch("/api/leaderboard", {
            headers: { "X-Telegram-Init-Data": tg?.initData || "" }
        });
        if (resp.ok) {
            const data = await resp.json();
            if (Array.isArray(data) && data.length) players = data;
        }
    } catch (_) { /* fallback */ }

    if (!players) {
        players = buildLocalLeaderboard();
    }

    renderLeaderboard(players);
}

function buildLocalLeaderboard() {
    const me = {
        name: player.name,
        avatar: player.avatar || "🧙",
        score: state.coins + state.totalCare * 5,
        isMe: true
    };
    const demo = [
        { name: "Гримли", avatar: "🧔", score: 2480 },
        { name: "Моховик", avatar: "🌿", score: 2110 },
        { name: "Тыквоголовый", avatar: "🎃", score: 1875 },
        { name: "Бородач II", avatar: "🍄", score: 1620 },
        { name: "Лесной дух", avatar: "🌲", score: 1400 },
        { name: "Каменюка", avatar: "🪨", score: 1230 },
        { name: "Мшистый", avatar: "🍀", score: 990 },
        { name: "Гном-новичок", avatar: "👶", score: 720 },
        { name: "Старый Пень", avatar: "🪵", score: 510 }
    ];
    return [...demo, me]
        .sort((a, b) => b.score - a.score)
        .slice(0, 10);
}

function escapeHTML(str) {
    return String(str).replace(/[&<>"']/g, s => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[s]));
}

function renderLeaderboard(players) {
    const box = document.getElementById("leaderboard");
    box.innerHTML = "";

    players.slice(0, 10).forEach((p, index) => {
        const row = document.createElement("div");
        row.className = "top-player";
        if (p.isMe) row.style.borderColor = "#d6ad48";

        const medal = index === 0 ? "🥇" : index === 1 ? "🥈" : index === 2 ? "🥉" : index + 1;

        row.innerHTML = `
            <div class="place">${medal}</div>
            <div class="avatar">${p.avatar && p.avatar.startsWith("http") 
                ? `<img src="${escapeHTML(p.avatar)}" style="width:100%;height:100%;border-radius:50%;object-fit:cover">`
                : (p.avatar || "🧙")}</div>
            <div class="top-info">
                <div class="top-name">${escapeHTML(p.name)}${p.isMe ? " (вы)" : ""}</div>
                <div class="top-score">${Number(p.score).toLocaleString("ru-RU")} очков</div>
            </div>
            ${index < 10 ? '<div class="exclusive">🎁 TOP 10</div>' : ""}
        `;
        box.appendChild(row);
    });

    if (!players.length) {
        box.innerHTML = '<div class="error">Рейтинг пока пуст.</div>';
    }
}

function showPage(page, button) {
    document.querySelectorAll(".page").forEach(x => x.classList.remove("active"));
    document.getElementById(page).classList.add("active");

    document.querySelectorAll(".nav button").forEach(x => x.classList.remove("active"));
    button.classList.add("active");

    if (page === "top") loadLeaderboard();
}

function animateGnome() {
    const gnome = document.querySelector(".gnome");
    if (!gnome) return;
    const mood = state.mood;
    const speed = mood > 70 ? 2 : mood > 40 ? 3 : 5;
    gnome.style.transition = "transform 0.6s ease-in-out";
    let t = 0;
    setInterval(() => {
        t += 0.1;
        const y = Math.sin(t) * 1.5;
        gnome.style.transform = `translateY(${y}px)`;
    }, speed * 100);
}

async function init() {
    loadState();
    await loadFromCloud();
    applyDecay();
    checkDailyReset();
    updateUI();
    animateGnome();

    setInterval(() => {
        applyDecay();
        updateUI();
        saveState();
    }, 30000);

    window.addEventListener("beforeunload", saveState);

    console.log("Игрок:", player);
}

init();
</script>
</body>
  </html>
